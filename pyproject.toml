[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "market-data-ml-pipeline"
version = "0.1.0"
description = "A runnable Data Engineering 101 workshop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "curl-cffi>=0.13,<1",
    "pandas>=2.2,<4",
    "polars>=1.30,<2",
    "prefect>=3.6,<4",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=19,<30",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.1",
    "yfinance>=1,<2",
]

[project.scripts]
market-data = "market_data.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["postgres: requires a disposable PostgreSQL database"]
