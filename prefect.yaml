name: market-data-ml-pipeline

# Register from src/ so the entrypoint resolves both here and in the run's checkout.
pull:
  - prefect.deployments.steps.git_clone:
      id: checkout
      repository: "{{ $PREFECT_CODE_REPOSITORY }}"
      commit_sha: "{{ $PREFECT_CODE_REVISION }}"
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ checkout.directory }}/src"

deployments:
  - name: daily-market-data
    version: "{{ $PREFECT_CODE_REVISION }}"
    entrypoint: market_data/flows/historical_ingestion.py:ingest_historical_prices
    description: Catch up from the latest trade date stored in Supabase.
    parameters:
      source: yfinance
      incremental: true # Read the latest saved trade date at the start of each run.
      require_db: true
      database_secret_block: market-data-supabase-url
      write_bronze: false
    work_pool:
      name: market-data-ml
      job_variables:
        image: prefecthq/prefect:3-python3.12
        # The managed pool installs these before it pulls and runs the code.
        pip_packages:
          - prefect==3.9.2
          - polars==1.44.2
          - pandas==3.1.1
          - "psycopg[binary]==3.3.8"
          - pyarrow==26.0.1
          - python-dotenv==1.2.4
          - tzdata==2026.6
          - yfinance==1.8.0
          - curl-cffi==0.17.0
    concurrency_limit: 1
    schedules:
      - cron: "0 6 * * *"
        timezone: Africa/Accra
        active: false # Enable after the fixture and live runs pass in your workspace.
